# Every assumption the calculations depend on. Nothing here is hardcoded in src/.
#
# Three different kinds of claim live in this file, and they are marked
# differently on purpose.
#
#   verified:   a FACT, confirmed against an official source or the data itself.
#               The same standard sources.yaml uses, where it means "observed in
#               a live response". Never set on a judgement.
#   calibrated: a THRESHOLD set from the observed distribution, with the evidence
#               recorded next to it. Defensible, but still a choice.
#   convention: an INTERPRETIVE CHOICE with no external truth to check it
#               against. Validated by backtest at best, never verified.
#
# Marking a convention `verified: true` would make it indistinguishable from a
# confirmed field name, which is the one thing this project cannot afford.
#
# Values marked `verified: false` are starting points that must be confirmed or
# tuned against real data before anything published depends on them.

meta:
  version: 1

# --------------------------------------------------------------------------- #
# Normalization (Deviation D1)
# --------------------------------------------------------------------------- #
percentiles:
  # Percentiles are computed as-of each date from a trailing window. A full-sample
  # percentile would rank a 2005 reading against data through 2026 and make the
  # backtest meaningless.
  window_months: 120            # 10-year trailing window
  min_history_months: 60        # no score published below 5 years of history
  method: weak                  # 'weak' (fraction at or below) | 'mid' (ties split)
  # Quarterly equivalents, for the euro-area series. Stated rather than derived
  # by dividing the monthly numbers by three at the call site: 40 quarters IS
  # ten years and 20 quarters IS five years, but a reader should be able to see
  # that decision instead of reconstructing it from an arithmetic expression.
  window_quarters: 40           # 10-year trailing window
  min_history_quarters: 20      # no score published below 5 years of history

# --------------------------------------------------------------------------- #
# Issuance ratio guards (Deviation D5)
# --------------------------------------------------------------------------- #
issuance:
  # Net marketable borrowing passes through zero, most sharply during binding
  # debt-ceiling episodes. Below this magnitude the ratio is suppressed rather
  # than reported. Units: USD millions of net issuance per month.
  min_abs_denominator_monthly_musd: 25000
  min_abs_denominator_quarterly_musd: 75000
  calibrated: 2026-08-18
  # Measured against |net marketable borrowing| over 306 months: median 65,167mn,
  # p25 29,011mn, p10 10,005mn. The 25,000 floor sits at the 22nd percentile and
  # suppresses 67 of 306 months; the quarterly floor suppresses 25% of quarters.
  # Roughly 38% of the median is a defensible "too small to divide by", but
  # masking a fifth of the sample is a real cost and the number is a choice, not
  # a fact — which is why this is `calibrated` and not `verified`.

  # TIPS excluded from the coupon aggregate: MSPD deltas absorb inflation
  # accretion, which is not issuance (Deviation D2). Revisit once the probe
  # confirms whether TIPS outstanding is reported at par.
  coupon_classes: [NOTES, BONDS, FRN]

  # Euro-area floors. Same purpose as the US one and set the same way, from the
  # observed distribution rather than by scaling the US number.
  #
  # A SINGLE shared floor was rejected. Measured on the first live Eurostat pull
  # (2026-08-19, 2000-Q1 to 2026-Q1), median |net borrowing| per quarter is
  # DE 9,647mn, FR 21,533mn and IT 25,664mn — Germany borrows less than half
  # what the other two do. One floor would mask roughly half of Germany's
  # quarters and a quarter of France's and Italy's, so the countries would be
  # scored on different amounts of their own history while sharing an axis.
  #
  # Each floor is instead 38% of that country's own median, which is the
  # fraction the US floor already implies (25,000 of a 65,167 monthly median).
  # The rule is carried over; only the scale changes.
  # Buyback adjustment. MSPD deltas net retired securities into "issuance", so
  # a coupon buyback reads as strategic coupon restraint when it is an announced
  # liquidity or cash-management operation — the D5 false-positive family, with
  # a published official series to correct from (buybacks_operations, verified).
  # Par retired is added back to the aggregate coupon flow in the funding and
  # coupon-restraint factors. Effect measured at first run recorded in the
  # commit that introduced this flag.
  buyback_adjustment: true

  min_abs_denominator_quarterly_meur:
    DE: 3700
    FR: 8200
    IT: 9800
  euro_calibrated: 2026-08-19

# --------------------------------------------------------------------------- #
# Debt ceiling episodes (Deviation D5)
# --------------------------------------------------------------------------- #
# During a binding ceiling Treasury runs bills down and net borrowing collapses;
# on resolution it rebuilds the TGA with a bill surge. That surge is mechanical,
# not a strategic duration decision, and is the most likely false positive in the
# whole system. These windows are shaded on charts, flagged on affected rows, and
# reported both included and excluded in the backtest.
#
# DATES BELOW ARE UNVERIFIED and must be checked against Treasury's own debt limit
# record before use. Month granularity is deliberate: MSPD is monthly.
debt_ceiling_episodes:
  # The post-resolution bill surge is a mechanical rebuild of the Treasury General
  # Account, not a decision to shorten the financing profile, and it is the most
  # likely false positive in the system (Deviation D5). Rather than relying on
  # these hand-entered dates alone, the score removes the change in cash balance
  # from both sides of the funding ratio — both series are published officially,
  # so it is a correction rather than an assumption.
  #
  # Measured effect on the 2023 resolution (Jun-Sep): bill share of net borrowing
  # falls from 90.8% to 83.6% once the $608bn cash rebuild is removed, and the
  # composite score falls from 66.7 to 60.2. It moderates the episode; it does
  # not erase it. Even ex-cash, 2023 was genuinely bill-heavy — so 2023 is not a
  # pure false positive and should not be treated as one.
  cash_adjustment: true
  verified: 2026-08-18
  verified_method: >
    Detected from Debt to the Penny rather than transcribed. A binding ceiling
    has an objective signature: total public debt outstanding pins just below the
    limit, so the range of daily readings over a trailing 20 business days
    collapses. Episodes below are every run of at least 45 days where that range
    stayed under $25bn, 2010-01 to 2026-08. The detected resolution dates match
    the previously hand-entered ones to within about two weeks in every case.
  verified_caveat: >
    `pinned_from` is when debt actually stopped moving, which is LATER than when
    the limit was reached and extraordinary measures began — typically by four to
    six weeks. The hand-entered `binding_from` values approximated the latter and
    are kept for comparison, still unverified. Use `pinned_from` for anything
    quantitative; it is the part confirmed by data.
  episodes:
    - {pinned_from: 2011-06-13, resolved: 2011-08-02, days: 50,  debt_tn: 14.34, prior_binding_from: 2011-05}
    - {pinned_from: 2013-06-13, resolved: 2013-10-17, days: 126, debt_tn: 16.74, prior_binding_from: 2013-05}
    - {pinned_from: 2015-03-18, resolved: 2015-11-02, days: 229, debt_tn: 18.15, prior_binding_from: 2015-03}
    - {pinned_from: 2017-04-11, resolved: 2017-09-08, days: 150, debt_tn: 19.85, prior_binding_from: 2017-03}
    - {pinned_from: 2019-03-28, resolved: 2019-08-02, days: 127, debt_tn: 22.03, prior_binding_from: 2019-03}
    - {pinned_from: 2021-08-26, resolved: 2021-10-14, days: 49,  debt_tn: 28.43, prior_binding_from: 2021-08}
    - {pinned_from: 2023-02-15, resolved: 2023-06-05, days: 110, debt_tn: 31.45, prior_binding_from: 2023-01}
    # NOT PRESENT in the hand-entered list at all. A 144-day episode, the most
    # recent one, inside the analysis window and affecting current readings.
    - {pinned_from: 2025-02-13, resolved: 2025-07-07, days: 144, debt_tn: 36.22, prior_binding_from: null}
  corrections_found: >
    Two. The 2021 entry read "resolved 2021-12" and conflated two separate
    events: the pinned period ended 2021-10-14 with the October short-term
    extension, and December was a second, distinct raise. And the 2025 episode
    was missing entirely.

# --------------------------------------------------------------------------- #
# WAM conventions (Deviation D9)
# --------------------------------------------------------------------------- #
wam:
  days_per_year: 365.25
  # Deviation D9(b). TIPS are published inflation-adjusted, so a total WAM mixing
  # them with par-reported classes weights TIPS by roughly their accretion. Par is
  # recoverable (outstanding - accretion) and is the basis used, so every class is
  # weighted on one footing.
  #
  # CONFIRMED 2026-08-21 against Treasury's own published series. The quarterly
  # release workbook carries "Average Maturity of Treasury Marketable
  # Securities--Total Outstanding (in months)" monthly back to 2000. Over 306
  # overlapping months our series differs by a MEDIAN OF +0.01 MONTHS, and from
  # 2008 onward by -0.32, -0.14 and -0.03 months per era. The PAR basis is right:
  # excluding TIPS altogether was tested and degrades every era, collapsing
  # agreement-within-half-a-month from 61% of months to 8%. Treasury includes
  # TIPS, on this footing. See docs/wam_reconciliation.md and
  # scripts/reconcile_wam.py, which re-runs the check.
  tips_weighting_basis: PAR
  verified: 2026-08-21
  maturity_buckets_years: [1, 2, 3, 5]
  use_final_maturity_for_frn: true
  use_final_maturity_for_tips: true

  # Callables mature at FINAL maturity here. Measured cost, 2026-08-21: this is
  # the largest single driver of the one era where we diverge from Treasury.
  # Maturing the fifteen pre-1985 ~30-year bonds at a 25-year call instead moves
  # 2001-2007 from +2.73 to +1.64 months and changes nothing after 2008.
  #
  # NOT CHANGED, deliberately. MSPD publishes no callable flag and no call date,
  # so modelling one means inferring WHICH securities are callable (pattern:
  # issued pre-1985, term >= 29y — never verified against a prospectus) and
  # inferring the DATE (maturity minus five years — assumed, not read). That
  # would replace a published maturity_date with a number this project made up,
  # to close 40% of a bias in a period the score uses only as percentile warm-up.
  # A measured, bounded, documented divergence is worth more than a modelled
  # correction that hides the same uncertainty inside a computed date.
  #
  # Residual after callables: about 1.6 months in 2001-2007, unexplained.
  # Refuted as explanations: TIPS exclusion, and bill weighting (bills are 27% of
  # par and would need carrying at ~33% to close the gap).
  model_call_dates: false
  model_call_dates_measured: 2026-08-21
  marketable_only: true

# --------------------------------------------------------------------------- #
# Auction stress
# --------------------------------------------------------------------------- #
auctions:
  trailing_auctions: 12
  min_trailing_auctions: 12     # fewer than this scores NaN, never a partial window
  min_components: 2
  scale_sigma: 3.0              # +/- 3 sd maps to +/- 100, clipped beyond
  long_end_terms: [10Y, 20Y, 30Y]
  long_end_window_days: 90
  long_end_min_auctions: 3
  # Bidder-class detail is materially richer from 2008. Earlier auctions are
  # ingested and scored on a reduced factor set, but excluded from the composite
  # by default.
  composite_start_date: 2008-04-01
  include_pre_2008_in_composite: false

# --------------------------------------------------------------------------- #
# Reference levels
# --------------------------------------------------------------------------- #
reference_levels:
  # TBAC has long referenced a bill share around this range. Shown as a band on
  # the bill share chart so the reader sees not just that the share rose, but that
  # it sits outside the range Treasury's own advisory committee recommends.
  bill_share_recommended_band: [0.15, 0.20]
  verified: 2026-08-19
  # VERIFIED against TBAC's own minutes, fetched by scripts/probe_tbac.py in
  # Actions (home.treasury.gov is refused by the development environment, which
  # is why this sat unverified for so long). Evidence: docs/source_probe/tbac/.
  #
  # Twelve separate sets of minutes state it in the committee's own words —
  # "TBAC's recommended range of 15 to 20%", "the recommended 15% to 20% range",
  # "the Committee's recommended range of 15-20% of outstanding debt". The
  # originating language reads: "the Committee recommended allowing the share of
  # T-Bills to decline gradually to a range of 15% to 20% of outstanding debt."
  verified_method: >
    Searched TBAC minutes and reports to the Secretary at home.treasury.gov.
    Twenty passages state the range next to a mention of bills; twelve distinct
    documents state it as the committee's recommendation. Cited below.
  cited_documents:
    - https://home.treasury.gov/news/press-releases/sm1175
    - https://home.treasury.gov/news/press-releases/jy0018
    - https://home.treasury.gov/news/press-releases/jy0909
    - https://home.treasury.gov/news/press-releases/jy1239
    - https://home.treasury.gov/news/press-releases/jy2316

  # THE DENOMINATOR MATCHES, which was not guaranteed. TBAC's band is the T-bill
  # share of DEBT OUTSTANDING — "leave the T-bill share of outstanding debt
  # within the recommended 15% to 20% range" — which is what the dashboard plots
  # it against. Had it been a share of issuance the band would have been drawn on
  # the wrong chart entirely.
  #
  # A SECOND, DIFFERENT TBAC RANGE EXISTS and must never be confused with this
  # one: 25-33% of NEW ISSUANCE ("TBAC's prior recommendation of 25-33% of new
  # issuance"). Different metric, different numbers, same committee. A third
  # figure, 30-35%, appears as a tolerance for what bills may reach "for short
  # periods", not as a target.
  second_band_do_not_conflate:
    share_of_new_issuance: [0.25, 0.33]
    source: https://home.treasury.gov/news/press-releases/sm678

  # The committee's language HAS shifted, exactly as the earlier note suspected.
  # The minutes contain "TBAC's PRIOR recommended range of 15-20%" and "the
  # Committee supported meaningful deviation from the historical recommendation
  # for 15-20% T-Bill share". So the band is real and correctly stated, but it is
  # a reference the committee has itself argued about — which is why it stays a
  # shaded reference on a chart and enters no calculation.
  caveat: >
    Treat as a reference the committee has debated, not a standing target. The
    probe could not date the citations: TBAC minutes are published as press
    releases labelled only "2nd Quarter", with no year in the URL or link text,
    so which quarters these span is still unresolved.

# --------------------------------------------------------------------------- #
# Score interpretation (Phase 2 - must be validated by backtest)
# --------------------------------------------------------------------------- #
duration_shift_score_bands:
  # A CONVENTION, not a fact. There is nothing external these could be checked
  # against — they define what the score's numbers are called. They are validated
  # by backtest rather than verified: on the current history the bands separate
  # the named episodes in the right order (2008 aggressive, 2011 extension, 2020
  # meaningful shortening, 2021 back to extension), which is evidence they are
  # not absurd, not evidence they are correct.
  convention: true
  validated_by_backtest: 2026-08-18
  # ...and validated for the SIX-FACTOR US SCORE ONLY. The cut-points are fixed
  # at 0/20/40/60/80/100, so what they mean depends entirely on how wide the
  # score's distribution is — and that differs by variant.
  #
  # Measured 2026-08-19 on live data, 234 US months against 179 euro-area
  # quarters: US sd 19.2, quantity_only sd 23.4. The two most severe labels
  # ("strong duration extension" and "aggressive shortening") catch 10.3% of US
  # readings and 24.0% of quantity-only ones — 2.3x as often, and 29.5% for
  # Germany alone. Three correlated quantity factors with no market-price anchor
  # diversify less than six with two orthogonal ones, so the composite is wider
  # and the same cut-points reach much further into the tail.
  #
  # So a quantity-only 63 has never been shown to mean what a full-score 63
  # means, and no euro-area backtest exists to show it. A variant not listed here
  # gets NO BAND rather than a relabelled one: renaming would give more careful
  # words to cut-points that still have no evidence behind them for that variant.
  # Same standard that already denies these scores a regime.
  validated_for_variants: [full]
  bands:
    - {name: strong duration extension, from: 0,  to: 20}
    - {name: modest extension,          from: 20, to: 40}
    - {name: neutral,                   from: 40, to: 60}
    - {name: meaningful shortening,     from: 60, to: 80}
    - {name: aggressive shortening,     from: 80, to: 100}

# Regimes are defined by measurable conditions, never by hand-applied labels.
# All listed conditions must hold; the highest satisfied regime wins.
regimes:
  # The LEVELS are a convention: where green becomes yellow is a choice.
  # The CORROBORATION thresholds are calibrated — they are percentiles of each
  # input's own point-in-time history, so they cannot drift out of range or be
  # unreachable the way the previous raw levels were.
  convention: true
  calibrated: 2026-08-18
  # The score band sets the base regime. Bands partition 0-100 by construction,
  # so every scored month is labelled — the previous scheme left 41% of months
  # matching no regime at all, because green required a score below 40 while
  # yellow required 40-or-above AND a bill-share condition, so readings in
  # between fell through into nothing.
  #
  # Market-price evidence then sets a CEILING on how far the reading may
  # escalate. It can cap a high score, never drop it into nothing: quantity
  # evidence alone is enough to call shortening, but calling duration PRESSURE
  # requires the market to agree. In 2020 the score was 66 on quantity while the
  # term premium was falling — the Fed was absorbing the issuance — so that
  # reads yellow, not orange. In 2023 both moved together and it reads orange.
  # That distinction is the thesis, so the classifier has to be able to make it.
  method: band_with_corroboration_ceiling
  # Score thresholds for the four regime levels, stated here rather than reused
  # from duration_shift_score_bands: there are FIVE interpretation bands and FOUR
  # regimes, so mapping one onto the other shifts every label by a band and puts
  # a score of 20 — strong duration extension — into yellow.
  levels:
    green_normal:              {score_at_least: 0}
    yellow_shortening:         {score_at_least: 40}
    orange_duration_pressure:  {score_at_least: 60}
    red_fiscal_dominance_risk: {score_at_least: 80}
  # Thresholds are PERCENTILES of each input's own point-in-time history, not
  # raw levels. Raw levels cannot be calibrated, and one of them was unreachable:
  # red previously required long_end_auction_stress >= 25 against a series whose
  # maximum over twenty years is 22.4, so the most severe regime in the system
  # could not fire in any state of the world, including 2008 and 2020.
  # Percentile thresholds also travel across sovereigns for Phase 3, where a raw
  # bill-share change means something different in Japan than in the US.
  corroboration:
    orange_duration_pressure:
      term_premium_10y_percentile_at_least: 70
      bill_share_12m_change_percentile_at_least: 60
    red_fiscal_dominance_risk:
      term_premium_10y_percentile_at_least: 85
      bill_share_12m_change_percentile_at_least: 80
      long_end_auction_stress_percentile_at_least: 90

# --------------------------------------------------------------------------- #
# Alerts (hooks designed now, wired in Phase 2)
# --------------------------------------------------------------------------- #
alerts:
  bill_share_new_5y_high: true
  bill_share_12m_change_above: 0.03
  wam_12m_decline_months_above: 0.5      # months of WAM lost over a year
  term_premium_10y_percentile_above: 80
  duration_shift_score_above: 70
  long_end_stress_persistent_days: 90
  # Phase 3
  simultaneous_shortening_sovereigns_at_least: 3

# --------------------------------------------------------------------------- #
# Validation
# --------------------------------------------------------------------------- #
validation:
  # Computed marketable total vs published MSPD total. A break is an error, not a
  # warning: a WAM that cannot reproduce the official total is not fit to publish.
  reconciliation_tolerance_pct: 0.1
  # Known defects in Treasury's own published subtotals. Each is corroborated by
  # two independent published figures before being listed here, and the check
  # stays strict everywhere else rather than being loosened to accommodate them.
  known_subtotal_defects:
    - observation_date: 2012-06-30
      security_class: BILLS
      reason: >
        "Total Unmatured Treasury Bills" reads 1,571,401.2775mn, understated by
        exactly 25,000.5804mn. The security-level detail sums to 1,596,401.4mn,
        which agrees with the same table's "Total Treasury Bills"
        (1,596,401.8579mn) and with mspd_table_1 BILLS to within rounding. The
        detail is right and the unmatured subtotal is wrong for this month.
  debt_to_penny_tolerance_pct: 0.1
  # WAM against Treasury's published monthly series (scripts/reconcile_wam.py).
  # Calibrated 2026-08-21 from the observed distribution: median difference
  # +0.01 months, and every era from 2008 within 0.32. A drift past half a month
  # in the MODERN period would be a real change in the pipeline or the source,
  # not noise — Treasury publishes whole months, so half a month is the rounding
  # floor and anything beyond it is signal.
  #
  # Judged from 2008 only. 2001-2007 carries a known +2.7 month divergence driven
  # by the callable convention (see the `wam` block); including it would make the
  # check fire permanently on something already understood and deliberately
  # accepted, which is how a check gets ignored.
  wam_vs_treasury:
    max_median_abs_difference_months: 0.5
    judge_from: 2008-01
    calibrated: 2026-08-21

  staleness_days:
    mspd: 45          # monthly, published around the 8th business day
    auctions: 7
    fred_daily: 5
    nyfed_acm: 10
    qra_manual: 100   # roughly one quarter plus a grace period
    # Eurostat gov_10q_ggdebt is quarterly and published roughly three months
    # after the reference quarter ends, so a healthy series is already ~100
    # days stale on the day it appears. 200 days allows one quarter's normal
    # lag plus a full quarter's grace before the feed is called dead.
    eurostat_quarterly: 200

# --------------------------------------------------------------------------- #
# Frequency alignment (Deviation D8)
# --------------------------------------------------------------------------- #
alignment:
  # Daily series are resampled to month end to meet monthly series. Monthly data
  # is never forward-filled onto a daily axis for signal purposes.
  common_frequency: M
  daily_to_monthly: last
  interaction_flag_horizon_months: 12

# --------------------------------------------------------------------------- #
# Storage boundaries (Deviation D7)
# --------------------------------------------------------------------------- #
storage:
  # The processed store is committed and redeployed with the app, so anything
  # rewritten on every refresh becomes permanent git history. Daily term premium
  # from 1991 gives the ten-year lead-in that D1 requires before a point-in-time
  # percentile may publish against a 2001 backtest start. Earlier history stays in
  # data/raw and is reproducible by re-running ingestion.
  term_premium_processed_start: 1991-01-01
