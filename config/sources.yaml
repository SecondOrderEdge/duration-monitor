        - auction_format
        - avg_med_discnt_margin
        - avg_med_discnt_rate
        - avg_med_investment_rate
        - avg_med_price
        - avg_med_yield
        - back_dated
        - back_dated_date
        - bid_to_cover_ratio
        - call_date
        - callable
        - called_date
        - cash_management_bill_cmb
        - closing_time_comp
        - closing_time_noncomp
        - comp_accepted
        - comp_bid_decimals
        - comp_tendered
        - comp_tenders_accepted
        - corpus_cusip
        - cpi_base_reference_period
        - currently_outstanding
        - cusip
        - dated_date
        - direct_bidder_accepted
        - direct_bidder_tendered
        - est_pub_held_mat_by_type_amt
        - fima_included
        - fima_noncomp_accepted
        - fima_noncomp_tendered
        - first_int_payment_date
        - first_int_period
        - floating_rate
        - frn_index_determination_date
        - frn_index_determination_rate
        - high_discnt_margin
        - high_discnt_rate
        - high_investment_rate
        - high_price
        - high_yield
        - index_ratio_on_issue_date
        - indirect_bidder_accepted
        - indirect_bidder_tendered
        - inflation_index_security
        - int_payment_frequency
        - int_rate
        - issue_date
        - low_discnt_margin
        - low_discnt_rate
        - low_investment_rate
        - low_price
        - low_yield
        - mat_date
        - maturity_date
        - max_comp_award
        - max_noncomp_award
        - max_single_bid
        - min_bid_amt
        - min_strip_amt
        - min_to_issue
        - multiples_to_bid
        - multiples_to_issue
        - nlp_exclusion_amt
        - nlp_reporting_threshold
        - noncomp_accepted
        - noncomp_tenders_accepted
        - offering_amt
        - original_cusip
        - original_dated_date
        - original_issue_date
        - original_security_term
        - pdf_filenm_announcemt
        - pdf_filenm_comp_results
        - pdf_filenm_noncomp_results
        - pdf_filenm_spec_announcemt
        - price_per100
        - primary_dealer_accepted
        - primary_dealer_tendered
