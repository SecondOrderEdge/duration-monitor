        - direct_bidder_accepted
        - indirect_bidder_accepted
        - reopening
      # All 114 fields the endpoint returns. Only the 18 above are contracted;
      # this list exists so the probe can report what the API has added or dropped.
      # It must stay complete — a partial baseline reports the rest as newly added.
      observed_fields_at_probe:
