        auction_date: date
        issue_date: date
        maturity_date: date
        security_type: category
        security_term: string
        original_security_term: string
        cusip: string
        offering_amt: decimal
        total_accepted: decimal
        comp_accepted: decimal
        soma_accepted: decimal
        total_tendered: decimal
        bid_to_cover_ratio: decimal
        high_yield: decimal
        low_yield: decimal
        avg_med_yield: decimal
        allocation_pctage: decimal
        primary_dealer_accepted: decimal
        direct_bidder_accepted: decimal
        indirect_bidder_accepted: decimal
        reopening: string
      probe_extra_fields:
        - median_yield          # absent — avg_med_yield is the published median
        - high_discnt_rate
        - low_discnt_rate
        - allocation_pctage
      resolved_unknowns:
        dealer_breakdown_start: >
          2008-04-07 is the first auction_date carrying a non-zero primary /
          direct / indirect breakdown. Auctions back to 1979-10-31 exist but have
          no breakdown at all, and those zeros mean "not reported", never "no
          dealer demand". This answers Open Question 3 on its facts: a stress
          series using bidder shares cannot start before 2008 without a reduced
          factor set.
      notes: >
        THE ENDPOINT PUBLISHES AUCTIONS THAT HAVE NOT HAPPENED YET. At probe time
        the maximum auction_date was 2026-08-20, days ahead of the last auction
        actually held, and every announced-but-unheld row carries "null" for
        bid_to_cover_ratio, high_yield, low_yield and avg_med_yield.

        Ingestion must therefore drop rows whose result fields are null rather
        than filtering on `auction_date <= today`, and any "latest auction" metric
        must resolve to the last row WITH RESULTS. A rolling stress score that
        takes the last N rows by date will otherwise silently average in
        scheduled auctions as missing data.

        Bills report on a discount basis: `high_discnt_rate` / `low_discnt_rate`
        are populated exactly where the yield fields are null, so a yield-only
        stress measure covers coupons and silently excludes the entire bill book —
        which is the part of the curve this project is most interested in.

