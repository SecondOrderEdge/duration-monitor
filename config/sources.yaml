# Source registry — single source of truth for every endpoint, file and series ID.
#
# `verified: true` means every field name below was OBSERVED in a live response by
# `scripts/probe_sources.py`, and the evidence is committed under the `evidence`
# path given per source. Nothing here is written from memory.
#
# Three distinct field lists, doing three different jobs:
#
#   expected_fields          The CONTRACT. Fields ingestion actually depends on.
#                            One going missing is a build failure, not a warning.
#   observed_fields_at_probe Everything the endpoint returned when last probed.
#                            The probe diffs against this to report fields the API
#                            has ADDED or DROPPED since — visible, but not fatal
#                            unless the dropped field is also in expected_fields.
#   schema                   Declared coercion per field, consumed by
#                            src/ingestion/typed.py. Never inferred from the data.
#
# Amounts: `units` states the reporting unit of the source. Ingestion stores raw
# exactly as retrieved; the transformation layer converts to single currency units
# so that no downstream code has to remember which endpoint reports millions.

meta:
  version: 2
  probe_required: true
  last_probe: 2026-08-18
  evidence: docs/source_probe/2026-08-18/
  # Every source is now verified against a live response. The 2026-08-18 run was
  # executed by .github/workflows/probe-sources.yml, which is the only place FRED
  # can be probed: it is the one credentialed source and the key lives in
  # repository secrets.

fiscaldata:
  base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/
  # Every value arrives as a string. Nulls arrive as the literal string "null".
  # MSPD additionally uses "*" for a value suppressed as negligible (observed at
  # 2024-06-30, where matured bills of ~$0.4mn print as "*"). Both are treated as
  # missing by the typed layer; "*" means "present but below reporting threshold",
  # which is why it must never be read as zero in a reconciliation.
  page_size_max: 10000
  pagination: page[number] / page[size]; meta carries total-count and total-pages.
  verified: true
  endpoints:

    mspd_table_1:
      path: v1/debt/mspd/mspd_table_1
      purpose: Marketable debt outstanding by security class, monthly. Drives Bill Share.
      date_field: record_date
      units: millions_usd
      verified: true
      coverage: {start: 2001-01-31, observed_end: 2026-07-31, rows_at_probe: 4645}
      expected_fields:
        - record_date
        - security_type_desc
        - security_class_desc
        - debt_held_public_mil_amt
        - intragov_hold_mil_amt
        - total_mil_amt
        - src_line_nbr
      observed_fields_at_probe:
        - debt_held_public_mil_amt
        - intragov_hold_mil_amt
        - record_calendar_day
        - record_calendar_month
        - record_calendar_quarter
        - record_calendar_year
        - record_date
        - record_fiscal_quarter
        - record_fiscal_year
        - security_class_desc
        - security_type_desc
        - src_line_nbr
        - total_mil_amt
      schema:
        record_date: date
        security_type_desc: category
        security_class_desc: category
        debt_held_public_mil_amt: decimal
        intragov_hold_mil_amt: decimal
        total_mil_amt: decimal
        src_line_nbr: integer
      row_grain: >
        14 rows per month. Component rows carry `security_type_desc` of
        "Marketable" or "Nonmarketable" with the class in `security_class_desc`.
        TOTAL rows put the label in `security_type_desc` — "Total Marketable",
        "Total Nonmarketable", "Total Public Debt Outstanding" — and set
        `security_class_desc` to the literal string "_". Filtering on
        `security_type_desc == "Marketable"` therefore selects exactly the six
        marketable component rows and excludes every total.
        Note "_" is a label, not a null: it must not be added to the null-token
        list, or the total rows become indistinguishable from missing data.
        Verified at 2024-06-30: Bills 5,765,830.1 + Notes 14,046,707.4 + Bonds
        4,581,064.9 + TIPS 2,053,866.3 + FRN 598,011.4 + FFB 4,514.1 ==
        27,049,994.2 == the published Total Marketable row, exactly.
      notes: >
        Bill share of marketable debt at 2024-06-30 is 21.32% on these figures —
        above the 15–20% TBAC reference band of Deviation D10.
        Federal Financing Bank is inside Total Marketable and is not a tradeable
        security; whether it belongs in the bill-share denominator is a stated
        convention, not an obvious call. It is 0.02% of the total, so it changes
        nothing numerically, but the choice belongs in thresholds.yaml rather than
        in whichever filter happens to be written first.

        Amounts are in MILLIONS (per the endpoint's own field labels), unlike
        debt_to_penny which reports whole dollars. Do not compare the two without
        scaling.

    mspd_table_3_market:
      path: v1/debt/mspd/mspd_table_3_market
      purpose: Security-level detail (issue/maturity date, outstanding). Drives WAM.
      date_field: record_date
      units: millions_usd
      verified: true
      coverage: {start: 2001-01-31, observed_end: 2026-07-31, rows_at_probe: 153404}
      resolved_unknowns:
        maturity_date_per_security: >
          CONFIRMED present for the full 2001-01 → 2026-07 history. Open Question 1
          in the implementation plan is closed: WAM can be computed independently
          from this table and needs no TreasuryDirect fallback (which is fortunate,
          since treasurydirect.gov remains blocked by network policy).
        cusip_field: >
          There is NO `cusip` field. The CUSIP is published in `security_class2_desc`
          — the same column that carries subtotal LABELS on subtotal rows. This is
          the single most dangerous field in the source: read naively, "Total
          Treasury Notes" is indistinguishable from a security identifier.
        tips_basis: >
          `outstanding_amt` is INFLATION-ADJUSTED, not par. Verified by identity on
          the Total Marketable row at 2024-06-30:
          issued_amt + inflation_adj_amt + redeemed_amt == outstanding_amt
          (26,677,744.007 + 392,813.400 + -20,563.200 == 27,049,994.207).
          Accretion is therefore separately published per row, so Deviation D2 is
          resolved by subtraction — par == outstanding_amt - inflation_adj_amt —
          and TIPS need not be excluded from the net-coupon aggregate.
      row_grain: >
        One row per (security, issue tranche). A reopened security appears once per
        reopening, each row carrying that tranche's `issued_amt`. `outstanding_amt`
        is populated on only the FIRST row of each security and holds the
        SECURITY-LEVEL total across all its tranches. Verified at 2024-06-30 for
        CUSIP 912797GB7: tranches of 40,996.0705 + 71,722.7826 + 74,085.9246 +
        65,000.2010 == 251,804.9787, the single populated outstanding_amt.
        Summing `outstanding_amt` over rows is therefore correct and summing
        `issued_amt` over rows is also correct, but mixing them double-counts.
        Independently confirmed at 2026-07-31: 887 rows, 463 distinct CUSIPs, with
        outstanding_amt null on 46% of rows. Selecting rows where outstanding_amt
        is non-null is an equivalent way to reach one row per security, PROVIDED
        subtotal rows are excluded first — they also carry a non-null
        outstanding_amt, so that filter alone silently includes them.
      subtotal_rows: >
        Subtotal rows carry a null `maturity_date` and put a label in
        `security_class2_desc`. Observed labels, stable 2001 → 2026:
        "Total Unmatured Treasury {Bills,Bonds,Notes}",
        "Total Matured Treasury {Bills,Bonds,Notes}",
        "Total Treasury {Bills,Bonds,Notes,TIPS,Floating Rate Notes}",
        plus "Total Marketable" and "Federal Financing Bank" in
        `security_class1_desc` with a null `security_class2_desc`.
        Filtering on `maturity_date` being non-null removes every subtotal row and
        leaves exactly the security-level universe. Reconciliation identity:
        Σ(security-level outstanding_amt) + Σ(Total Matured *) + Federal Financing
        Bank == Total Marketable. Verified within 0.001% at 2001-01-31, 2008-09-30,
        2015-06-30, 2024-06-30 and 2026-07-31.
      expected_fields:
        - record_date
        - security_type_desc
        - security_class1_desc
        - security_class2_desc
        - issue_date
        - maturity_date
        - interest_rate_pct
        - yield_pct
        - issued_amt
        - inflation_adj_amt
        - redeemed_amt
        - outstanding_amt
        - src_line_nbr
      observed_fields_at_probe:
        - inflation_adj_amt
        - interest_pay_date_1
        - interest_pay_date_2
        - interest_pay_date_3
        - interest_pay_date_4
        - interest_rate_pct
        - issue_date
        - issued_amt
        - maturity_date
        - outstanding_amt
        - record_calendar_day
        - record_calendar_month
        - record_calendar_quarter
        - record_calendar_year
        - record_date
        - record_fiscal_quarter
        - record_fiscal_year
        - redeemed_amt
        - security_class1_desc
        - security_class2_desc
        - security_type_desc
        - series_cd
        - src_line_nbr
        - yield_pct
      schema:
        record_date: date
        security_type_desc: category
        security_class1_desc: category
        security_class2_desc: string      # CUSIP *or* a subtotal label — never a category
        issue_date: date
        maturity_date: date
        interest_rate_pct: decimal
        yield_pct: decimal
        issued_amt: decimal
        inflation_adj_amt: decimal
        redeemed_amt: decimal
        outstanding_amt: decimal
        src_line_nbr: integer
      notes: >
        ~840 rows per month at 2024, ~220 at 2001; 153k rows over the full history.
        Small enough to hold in memory, large enough that D7 (keep full history out
        of git) still stands.

        `interest_rate_pct` is "null" for bills, which are discount securities and
        carry no coupon. That is expected, not a parse failure, and a WAM weighted
        by coupon would silently drop the entire bill book.

        The TIPS accretion identity was separately confirmed across all 53 TIPS
        CUSIPs at 2026-07-31, not only on the Total Marketable row.

    auctions_query:
      path: v1/accounting/od/auctions_query
      purpose: Auction results. Drives auction stress metrics.
      date_field: auction_date
      units: usd
      verified: true
      coverage: {start: 1979-10-31, observed_end: 2026-08-20, rows_at_probe: 11080}
      resolved_unknowns:
        dispersion_fields: >
          Deviation D3 is viable as preferred. `low_yield` and `allocation_pctage`
          (allotment at the high) are both published. There is no `median_yield`
          field, but `avg_med_yield` is the median yield and is published — verified
          at the 2024-06-13 29Y11M auction: high 4.4030, median 4.3500, low 3.8800,
          allotment 8.49%. High-minus-median and allotment-at-high can therefore be
          used directly, and the noisy CMT-based tail proxy stays a weight-0
          diagnostic as planned.
      expected_fields:
        - auction_date
        - issue_date
        - maturity_date
        - security_type
        - security_term
        - original_security_term
        - cusip
        - offering_amt
        - total_accepted
        - comp_accepted
        - soma_accepted
        - total_tendered
