    mts_table_1:
      path: v1/accounting/mts/mts_table_1
      purpose: Monthly receipts / outlays / deficit.
      date_field: record_date
      units: usd
      verified: true
      coverage: {start: 2015-03-31, observed_end: 2026-07-31, rows_at_probe: 3090}
      expected_fields:
        - record_date
        - classification_desc
        - classification_id
        - parent_id
