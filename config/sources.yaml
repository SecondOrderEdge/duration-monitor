        - sequence_level_nbr
        - line_code_nbr
      observed_fields_at_probe:
        - classification_desc
        - classification_id
        - current_month_dfct_sur_amt
        - current_month_gross_outly_amt
        - current_month_gross_rcpt_amt
        - data_type_cd
        - line_code_nbr
        - parent_id
        - print_order_nbr
        - record_calendar_day
        - record_calendar_month
        - record_calendar_quarter
        - record_calendar_year
        - record_date
        - record_fiscal_quarter
        - record_fiscal_year
        - record_type_cd
        - sequence_level_nbr
        - sequence_number_cd
        - src_line_nbr
        - table_nbr
      schema:
        record_date: date
        classification_desc: string
        classification_id: string
        parent_id: string
        current_month_gross_rcpt_amt: decimal
        current_month_gross_outly_amt: decimal
        current_month_dfct_sur_amt: decimal
        record_type_cd: category
        sequence_level_nbr: string
        line_code_nbr: string
      contract_correction: >
        The v1 contract expected `current_month_budget_amt` and
        `current_fytd_budget_amt`. Neither exists. The published fields are
        `current_month_gross_rcpt_amt`, `current_month_gross_outly_amt` and
        `current_month_dfct_sur_amt`.
      notes: >
        TWO constraints that bind on design, not just on parsing.
        (1) Coverage starts 2015-03, not 2001. Any factor drawing on the MTS deficit
        is limited to ~11 years, which is short against the D1 minimum-history rule
        for point-in-time percentiles. Either the financing-need factor uses a
        longer FRED series instead, or the composite must tolerate a factor with a
        later start date.
        (2) The rows are NOT a monthly time series. Each `record_date` carries a
        fiscal-year × month matrix: a parent row labelled "FY 2025" with child rows
        labelled "October", "November", … The observation month must be derived from
        `classification_desc` joined to its parent via `parent_id`, and
        `record_type_cd` distinguishes month rows (MTH) from subtotals (SL).
        Reading `record_date` as the observation date silently stamps every row of a
        fiscal year with the publication month.
        (3) There is NO fiscal-year-to-date column on this endpoint — confirmed
        against its full field list, not a sample. FYTD must be accumulated from
        the monthly rows within each record_fiscal_year, or taken from a different
        MTS table. The absent `current_fytd_budget_amt` was not renamed; it does
        not exist here in any spelling.

fred:
  base_url: https://api.stlouisfed.org/fred/
  api_key_env: FRED_API_KEY
  verified: true
  verified_on: 2026-08-18
  evidence: docs/source_probe/2026-08-18/
  verified_note: >
    All 21 series confirmed against live responses. The probe runs in GitHub
    Actions (.github/workflows/probe-sources.yml) because FRED is the one
    credentialed source and the key lives in repository secrets — cloud dev
    environments have no secrets store, so this cannot be verified from one.
    Frequencies, units and coverage below are observed, not assumed.

  # UNITS ARE NOT CONSISTENT ACROSS THIS FEED, and the inconsistency sits inside a
  # single group: RRPONTSYD is BILLIONS while WALCL, WRESBAL and WTREGEN are
  # MILLIONS. Netting them without scaling is a 1000x error that still plots as a
  # plausible line. Every series therefore carries its observed units below, and
  # the transformation layer converts to single currency units on the way in.
  #
  # SEASONAL ADJUSTMENT IS NOT CONSISTENT EITHER. GDP, FGRECPT and
  # A091RC1Q027SBEA are SAAR — seasonally adjusted ANNUAL RATES — while every
  # other series is NSA. A SAAR quarterly figure is already annualised, so
  # comparing it to a quarterly flow from MSPD, or summing four quarters of it,
  # overstates by roughly 4x.

  series:
    rates:
      [DGS3MO, DGS6MO, DGS1, DGS2, DGS5, DGS10, DGS20, DGS30]
    liquidity:
      [WALCL, WRESBAL, RRPONTSYD, WTREGEN, SOFR, EFFR, MMMFFAQ027S]
    fiscal:
      [GFDEBTN, FYFSGDA188S, A091RC1Q027SBEA, FGRECPT, GDP]
    term_premium_crosscheck:
      [THREEFYTP10]

  # observed: {frequency, units, seasonal adjustment, coverage} as at 2026-08-18.
  series_observed:
    DGS3MO:          {freq: D, units: percent,        sa: NSA,  start: 1981-09-01, end: 2026-08-14}
    DGS6MO:          {freq: D, units: percent,        sa: NSA,  start: 1981-09-01, end: 2026-08-14}
    DGS1:            {freq: D, units: percent,        sa: NSA,  start: 1962-01-02, end: 2026-08-14}
    DGS2:            {freq: D, units: percent,        sa: NSA,  start: 1976-06-01, end: 2026-08-14}
    DGS5:            {freq: D, units: percent,        sa: NSA,  start: 1962-01-02, end: 2026-08-14}
    DGS10:           {freq: D, units: percent,        sa: NSA,  start: 1962-01-02, end: 2026-08-14}
    DGS20:           {freq: D, units: percent,        sa: NSA,  start: 1962-01-02, end: 2026-08-14}
    DGS30:           {freq: D, units: percent,        sa: NSA,  start: 1977-02-15, end: 2026-08-14}
    WALCL:           {freq: W, units: millions_usd,   sa: NSA,  start: 2002-12-18, end: 2026-08-12}
    WRESBAL:         {freq: W, units: millions_usd,   sa: NSA,  start: 2002-12-18, end: 2026-08-12}
    RRPONTSYD:       {freq: D, units: billions_usd,   sa: NSA,  start: 2003-02-07, end: 2026-08-18}
    WTREGEN:         {freq: W, units: millions_usd,   sa: NSA,  start: 2002-12-18, end: 2026-08-12}
    SOFR:            {freq: D, units: percent,        sa: NSA,  start: 2018-04-03, end: 2026-08-17}
    EFFR:            {freq: D, units: percent,        sa: NSA,  start: 2000-07-03, end: 2026-08-17}
    MMMFFAQ027S:     {freq: Q, units: millions_usd,   sa: NSA,  start: 1945-10-01, end: 2026-01-01}
    GFDEBTN:         {freq: Q, units: millions_usd,   sa: NSA,  start: 1966-01-01, end: 2026-01-01}
    FYFSGDA188S:     {freq: A, units: percent_of_gdp, sa: NSA,  start: 1929-01-01, end: 2025-01-01}
    A091RC1Q027SBEA: {freq: Q, units: billions_usd,   sa: SAAR, start: 1947-01-01, end: 2026-04-01}
    FGRECPT:         {freq: Q, units: billions_usd,   sa: SAAR, start: 1947-01-01, end: 2026-01-01}
    GDP:             {freq: Q, units: billions_usd,   sa: SAAR, start: 1947-01-01, end: 2026-04-01}
    THREEFYTP10:     {freq: D, units: percent,        sa: NSA,  start: 1990-01-02, end: 2026-08-07}

  known_gaps:
    DGS20: >
      Config has long asserted the series is discontinued 1987-01 to 1993-09. The
      probe records observation_start 1962-01-02 and an end in 2026, which spans
      the gap and therefore neither confirms nor refutes it — start/end cannot
      reveal an interior hole. Treat as UNVERIFIED and check the observations
      themselves before the 20Y is used in any curve calculation. Flag as missing;
      never fill.
    MMMFFAQ027S: Quarterly frequency, confirmed. Do not forward-fill onto a daily axis.
    FYFSGDA188S: >
      ANNUAL, and the latest observation is 2025-01-01 — both coarser and more
      lagged than anything else here. It cannot contribute to a monthly signal
      without an interpolation this project forbids. Suitable as chart context
      only, not as a score input.

nyfed_acm:
  # No API. Scheduled file pull, parsed with pandas.
  url: https://www.newyorkfed.org/medialibrary/media/research/data_indicators/ACMTermPremium.xls
  landing_page: https://www.newyorkfed.org/research/data_indicators/term-premia-tabs
  verified: true

  # THE WORKBOOK HAS TWO SHEETS AND THE PANDAS DEFAULT IS THE WRONG ONE.
  # Reading without an explicit sheet_name returns "ACM Monthly" — 782 month-end
  # rows — which then gets treated as the daily series it is not. The failure is
  # invisible: month-end term premia are entirely plausible daily values, and
  # Deviation D8 (resample the daily premium to month end) would be silently
  # skipped rather than performed.
  engine: xlrd            # openpyxl cannot read this file; the engine is not optional
  sheet: ACM Daily        # always name it
  sheets:
    ACM Daily:   {rows: 16252, start: 1961-06-14, end: 2026-08-07}
    ACM Monthly: {rows: 782,   start: 1961-06-30, end: 2026-07-31}
  format: >
    Genuine legacy .xls (Content-Type application/vnd.ms-excel, ~10MB).
  observed_columns: >
    31 columns on both sheets: DATE, ACMY01..ACMY10 (fitted yields),
    ACMTP01..ACMTP10 (term premia), ACMRNY01..ACMRNY10 (risk-neutral yields).
  date_parsing: >
    DATE arrives as a STRING formatted "07-Aug-2026" (%d-%b-%Y) — not an Excel
    serial and not a datetime. Parse it explicitly; pandas inference on this
    format is locale-sensitive and will silently produce NaT or a wrong year.
  series_of_interest: [ACMTP02, ACMTP05, ACMTP10]
  series_of_interest_confirmed: [ACMTP02, ACMTP05, ACMTP10]
  revision_policy: >
    ACM estimates are model output and are re-estimated retroactively. Every pull
    stores retrieval_date and is diffed against the prior vintage; changes to
    historical values raise a revision flag rather than being silently overwritten.

treasurydirect:
  # Not used. Retained so the reason is on the record rather than rediscovered.
  base_url: https://www.treasurydirect.gov/TA_WS/
  verified: false
  status: >
    Blocked by network egress policy (403 at CONNECT) at the 2026-08-17 probe,
    while every other host became reachable. It was only ever the fallback source
    for per-security maturity dates, and mspd_table_3_market carries those for the
    full history, so nothing depends on it.

manual:
  qra_log:
    path: data/manual/qra_log.csv
    purpose: Quarterly Refunding Announcement facts. No API exists.
    entry: Streamlit page app/pages/6_QRA_Input.py
    rule: Every row must carry source_url pointing at the official Treasury document.
