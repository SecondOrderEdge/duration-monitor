# Verifies the source contract in config/sources.yaml against live responses.
#
# This runs here rather than locally because FRED is the one credentialed source
# and the key lives in repository secrets. Cloud dev environments have no secrets
# store, so Actions is the only place the probe can verify FRED at all.
#
# The job commits the evidence it produces. scripts/probe_sources.py scrubs the
# API key from everything it writes — see tests/test_probe_redaction.py — because
# Actions masks secrets in logs but not in files a job commits.

name: Probe sources

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Restrict to one source (fiscaldata, fred, nyfed, phase3, tbac). Blank probes all."
        required: false
        default: ""
        type: string
  push:
    # Any change to the contract or the probe itself should be re-verified
    # against live responses. Deliberately narrow: the evidence the job commits
    # lives under docs/source_probe/, which is not in this list, so a run cannot
    # retrigger itself.
    paths:
      - config/sources.yaml
      - scripts/probe_sources.py
      - scripts/probe_phase3.py
      - scripts/probe_tbac.py
      - .github/workflows/probe-sources.yml
  schedule:
    # Weekly contract check: a field that disappears should surface on its own,
    # not the next time someone happens to run ingestion.
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report credential availability
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # Presence only. Never echo the value.
          if [ -n "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY is set (${#FRED_API_KEY} characters)."
          else
            echo "::warning::FRED_API_KEY is not set; FRED series will be skipped."
          fi

      - name: Run probe
        id: probe
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e
          ARGS=""
          case "${{ inputs.only }}" in
            "")        ARGS="" ;;
            phase3|tbac) echo "skipping the Phase 1 contract probe" | tee probe_stdout.txt; exit 0 ;;
            *)         ARGS="--only ${{ inputs.only }}" ;;
          esac
          python scripts/probe_sources.py $ARGS | tee probe_stdout.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Probe Phase 3 candidate sources
        # Discovery, not a contract check, and it never fails the run: an
        # unreachable publisher is a finding. It lives here because every Phase 3
        # host is refused by the development environment's egress policy while
        # the Phase 1 hosts are allowed, so this is the only place it can see them.
        if: inputs.only == '' || inputs.only == 'phase3'
        run: python scripts/probe_phase3.py | tee -a probe_stdout.txt

      - name: Probe the TBAC bill-share band
        timeout-minutes: 25
        # The one dashboard number sourced to memory rather than to a fetched
        # artefact. home.treasury.gov is refused by the development
        # environment while api.fiscaldata.treasury.gov is allowed, so this is
        # the only place the document itself can be reached.
        #
        # pypdf is installed HERE and not in requirements.txt: the deployed app
        # has no use for a PDF parser and should not carry one.
        if: inputs.only == '' || inputs.only == 'tbac'
        run: |
          # NOT weekly. This crawls ~80 documents off Treasury's own web server
          # over fifteen minutes, and the claim it checks is now verified and
          # changes rarely — running that every Monday is disproportionate to
          # what it can learn and impolite to someone else's infrastructure.
          #
          # Scheduled runs therefore fire only in the first week of a refunding
          # month (Feb/May/Aug/Nov), which is TBAC's own publication cycle: the
          # cadence is set by when new minutes can exist, not by the workflow
          # this step happens to live in. An explicit dispatch always runs.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MONTH=$(date -u +%m); DAY=$(date -u +%d)
            case "$MONTH" in
              02|05|08|11) ;;
              *) echo "Not a refunding month; skipping the TBAC probe." | tee -a probe_stdout.txt; exit 0 ;;
            esac
            if [ "$DAY" -gt 07 ]; then
              echo "Past the first week of the refunding month; skipping." | tee -a probe_stdout.txt
              exit 0
            fi
          fi
          pip install -r requirements-probe.txt
          python -u scripts/probe_tbac.py | tee -a probe_stdout.txt

      - name: Summarise
        run: |
          {
            echo '## Probe result'
            echo
            echo '```'
            cat probe_stdout.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f probe_stdout.txt

      - name: Commit evidence
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source_probe
          if git diff --cached --quiet; then
            echo "No change in probe evidence."
          else
            git commit -m "probe: live source evidence ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Evidence is committed first, then the contract result decides the job.
      # A break is most useful with its evidence already in the repo.
      - name: Fail on contract break
        if: steps.probe.outputs.exit_code != '0'
        run: |
          echo "::error::Probe reported a contract break or an unreachable source."
          exit 1
